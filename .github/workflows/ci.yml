name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So "can a runner start at all" can be asked without pushing a commit —
  # a question that turned out to matter more than any test result.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The vault falls back to a passphrase where there is no login keychain,
  # which is what a CI runner is.
  GABRIEL_VAULT_PASSPHRASE: ci-only-passphrase-not-a-secret

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      # Every test binds 127.0.0.1 and spawns its own server, so the suite needs
      # no services — but it does need loopback, which all three runners have.

  lint:
    name: format and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Shell that only runs during a release is shell that is never exercised
      # until it matters most. A syntax check is cheap insurance.
      - name: Shell scripts parse
        run: |
          set -euo pipefail
          for script in install.sh scripts/*.sh; do
            sh -n "$script" && echo "ok  $script"
          done
          bash -n installer-tests/run.sh && echo "ok  installer-tests/run.sh"

      # Published prose is an output surface with no canary to inject, so
      # it is checked by shape instead.
      - name: Nothing credential-shaped in published text
        run: |
          set -euo pipefail
          ./scripts/scan-secrets.sh README.md CHANGELOG.md docs/*.md

      # A release must be able to describe itself. Checking here means the
      # failure lands on the pull request rather than half way through a tag
      # build, when artifacts have already been produced.
      - name: The current version is documented in the changelog
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          ./scripts/release-notes.sh "$version" > /dev/null
          echo "CHANGELOG.md documents $version"

  installer:
    name: installer suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the binary the installer will ship
        run: cargo build --release -p gabriel-cli
      # The installer is a trust boundary, and the only bugs it has had were
      # invisible until it ran. It gets its own suite, on every push.
      - name: Installer regression suite
        run: ./installer-tests/run.sh

  audit:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
