name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So "can a runner start at all" can be asked without pushing a commit —
  # a question that turned out to matter more than any test result.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The vault falls back to a passphrase where there is no login keychain,
  # which is what a CI runner is.
  GABRIEL_VAULT_PASSPHRASE: ci-only-passphrase-not-a-secret

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets
      # Job logs need admin rights to read, even on a public repository, so a
      # failure here is invisible to anyone who does not own the repo —
      # including whoever is trying to fix it. Annotations are public, so the
      # failing test names are re-emitted as annotations, and the full output
      # is kept as an artifact. Evidence is only useful if it reaches the
      # person who needs it.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          if cargo test --workspace 2>&1 | tee test-output.txt; then
            exit 0
          fi
          echo "::error::cargo test failed"
          grep -E "^test .* FAILED" test-output.txt | head -20 \
            | while IFS= read -r l; do echo "::error::$l"; done
          grep -A4 -E "^---- .* stdout ----" test-output.txt | head -40 \
            | while IFS= read -r l; do echo "::error::$l"; done
          exit 1

      # A reader that stops early is normal — `gabriel ls | head -1`,
      # `run --quiet | jq`. Rust ignores SIGPIPE, so an unguarded CLI panics
      # instead of ending quietly, and the errno differs by platform: Unix
      # reports EPIPE, Windows reports one of several pipe errors. This runs on
      # all three, because a fix verified on one proves nothing about the others
      # — which is how it reached a release smoke job the first time.
      - name: A closed reader ends the command quietly
        shell: bash
        run: |
          set -uo pipefail
          bin="$PWD/target/debug/gabriel"
          [ -x "$bin" ] || bin="$PWD/target/debug/gabriel.exe"
          [ -x "$bin" ] || { echo "::error::no gabriel binary in target/debug"; exit 1; }

          work=$(mktemp -d)
          cd "$work"
          "$bin" init pipecheck >/dev/null 2>&1

          fail=0
          # `| true` closes the pipe before the first byte: the deterministic
          # form of the race that `head -1` and `grep -q` win sometimes.
          for cmd in "ls" "doctor" "env" "capture ls"; do
            "$bin" $cmd 2>stderr.txt | true
            rc=${PIPESTATUS[0]}
            if [ "$rc" -ne 0 ]; then
              echo "::error::\`gabriel $cmd | true\` exited $rc, expected 0"
              sed 's/^/::error::/' stderr.txt
              fail=1
            elif grep -qi "panicked" stderr.txt; then
              echo "::error::\`gabriel $cmd | true\` panicked"
              sed 's/^/::error::/' stderr.txt
              fail=1
            fi
          done

          "$bin" ls | head -1 >/dev/null
          [ "${PIPESTATUS[0]}" -eq 0 ] || { echo "::error::ls | head -1 exited ${PIPESTATUS[0]}"; fail=1; }
          "$bin" doctor | grep -q collection
          [ "${PIPESTATUS[0]}" -eq 0 ] || { echo "::error::doctor | grep -q exited ${PIPESTATUS[0]}"; fail=1; }

          exit "$fail"

      - name: Keep the output even when it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}
          path: test-output.txt
          retention-days: 7
      # Every test binds 127.0.0.1 and spawns its own server, so the suite needs
      # no services — but it does need loopback, which all three runners have.

  lint:
    name: format and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Shell that only runs during a release is shell that is never exercised
      # until it matters most. A syntax check is cheap insurance.
      - name: Shell scripts parse
        run: |
          set -euo pipefail
          for script in install.sh scripts/*.sh; do
            sh -n "$script" && echo "ok  $script"
          done
          bash -n installer-tests/run.sh && echo "ok  installer-tests/run.sh"

      # Published prose is an output surface with no canary to inject, so
      # it is checked by shape instead.
      - name: Nothing credential-shaped in published text
        run: |
          set -euo pipefail
          ./scripts/scan-secrets.sh README.md CHANGELOG.md docs/*.md

      # A release must be able to describe itself. Checking here means the
      # failure lands on the pull request rather than half way through a tag
      # build, when artifacts have already been produced.
      - name: The current version is documented in the changelog
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          ./scripts/release-notes.sh "$version" > /dev/null
          echo "CHANGELOG.md documents $version"

  installer:
    name: installer suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the binary the installer will ship
        run: cargo build --release -p gabriel-cli
      # The installer is a trust boundary, and the only bugs it has had were
      # invisible until it ran. It gets its own suite, on every push.
      - name: Installer regression suite
        run: ./installer-tests/run.sh

  audit:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
