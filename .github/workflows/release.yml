name: Release

on:
  push:
    tags: ["v*"]
  # Lets the workflow be rehearsed without cutting a tag.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install cross-linker
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p gabriel-cli

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          staging="gabriel-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/gabriel" "$staging/"
          cp README.md LICENSE "$staging/"
          tar czf "$staging.tar.gz" "$staging"
          shasum -a 256 "$staging.tar.gz" > "$staging.tar.gz.sha256"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          staging="gabriel-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/gabriel.exe" "$staging/"
          cp README.md LICENSE "$staging/"
          7z a "$staging.zip" "$staging"
          certutil -hashfile "$staging.zip" SHA256 > "$staging.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            gabriel-*.tar.gz
            gabriel-*.zip
            gabriel-*.sha256



  sbom:
    name: software bill of materials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Generate CycloneDX SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --describe binaries -q
          # One SBOM per shipped binary; the bench harness is not shipped.
          mv crates/gabriel-cli/gabriel_bin.cdx.json \
             "gabriel-sbom.cdx.json"
      - name: Sanity-check it
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open([f for f in __import__("os").listdir(".") if f.endswith("sbom.cdx.json")][0]))
          assert d["bomFormat"] == "CycloneDX", d.get("bomFormat")
          components = d.get("components", [])
          assert len(components) > 50, f"only {len(components)} components — that cannot be right"
          missing = [c["name"] for c in components if not c.get("licenses")]
          print(f"{len(components)} components, {len(missing)} without licence data")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: gabriel-sbom.cdx.json

  smoke:
    name: smoke ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Only the targets a runner can actually execute. The two cross-built
          # ones (x86_64-apple-darwin, aarch64-unknown-linux-gnu) are shipped
          # untested by this job — noted here rather than left to be assumed.
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.target }}

      - name: Verify the checksum
        shell: bash
        run: |
          set -euo pipefail
          archive=$(ls gabriel-*.tar.gz gabriel-*.zip 2>/dev/null | head -1)
          echo "archive: $archive"
          if command -v shasum >/dev/null; then
            shasum -a 256 -c "$archive.sha256"
          else
            # certutil's output is not in `sha256sum -c` format, so compare by hand.
            expected=$(grep -Eo '\b[0-9a-fA-F]{64}\b' "$archive.sha256" | head -1 | tr 'A-Z' 'a-z')
            actual=$(sha256sum "$archive" | cut -d' ' -f1)
            echo "expected $expected"
            echo "actual   $actual"
            [ "$expected" = "$actual" ]
          fi

      - name: Install the artifact the way a user would
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          archive=$(ls gabriel-*.tar.gz gabriel-*.zip 2>/dev/null | head -1)
          case "$archive" in
            *.tar.gz) tar xzf "$archive" ;;
            *.zip)    unzip -q "$archive" ;;
          esac
          staged=$(basename "$archive" | sed -e 's/\.tar\.gz$//' -e 's/\.zip$//')
          cp "$staged"/gabriel* "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # From here on, only the installed binary is used — never cargo, never the
      # source tree. This job has no checkout on purpose: if it passes, the
      # artifact alone is sufficient.
      - name: Version matches the tag
        shell: bash
        run: |
          set -euo pipefail
          reported=$(gabriel --version)
          echo "$reported"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            expected="${GITHUB_REF_NAME#v}"
            echo "$reported" | grep -Fq "$expected" \
              || { echo "binary reports '$reported' but the tag is '$GITHUB_REF_NAME'"; exit 1; }
          fi

      - name: Diagnostics run and pass
        shell: bash
        run: |
          set -euo pipefail
          gabriel doctor
          gabriel doctor --json | grep -q '"status"'

      - name: A collection can be created and read back
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke && cd smoke
          gabriel init smoke-collection
          gabriel ls | grep -q example
          gabriel env | grep -q dev
          gabriel doctor | grep -q "collection"

      - name: An offline request is generated and inspected
        shell: bash
        env:
          # No login keychain on a CI runner.
          GABRIEL_VAULT_PASSPHRASE: smoke-test-passphrase
        run: |
          set -euo pipefail
          cd smoke
          gabriel curl example | grep -q "^curl"
          gabriel vault set smoke-secret shhh
          gabriel vault ls | grep -q smoke-secret
          # A token with a known payload, decoded without a network.
          token='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJzbW9rZSIsImV4cCI6NDg4NDAwMDAwMH0.c2ln'
          gabriel jwt "$token" | grep -q smoke

      - name: A real request is sent and replayed
        shell: bash
        env:
          GABRIEL_VAULT_PASSPHRASE: smoke-test-passphrase
        run: |
          set -euo pipefail
          cd smoke
          # A local origin, so the smoke test needs no internet and cannot be
          # flaky because somebody else's service is down.
          mkdir -p origin && printf '{"ok":true,"from":"smoke"}' > origin/get
          # Ubuntu runners ship python3; the Windows image ships python.
          py=$(command -v python3 || command -v python)
          (cd origin && "$py" -m http.server 8799 >/dev/null 2>&1 &)
          for _ in $(seq 1 30); do
            curl -fsS "http://127.0.0.1:8799/get" >/dev/null 2>&1 && break
            sleep 0.5
          done

          gabriel run example --var base_url=http://127.0.0.1:8799 | tee run.out
          grep -q '"from"' run.out

          # And the same request through the collection runner, with reports.
          gabriel run --all --var base_url=http://127.0.0.1:8799 \
            --junit results.xml --html report.html
          grep -q "<testsuites" results.xml
          grep -q "<!doctype html>" report.html

      - name: Traffic can leave and come back
        shell: bash
        env:
          GABRIEL_VAULT_PASSPHRASE: smoke-test-passphrase
        run: |
          set -euo pipefail
          cd smoke
          gabriel har export --out out.har
          grep -q '"version": "1.2"' out.har
          gabriel har import out.har

  release:
    name: publish release
    needs: [build, smoke, sbom]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      # Keyless signing: the certificate is bound to this workflow's identity,
      # so there is no private key to store, rotate, or lose.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: One checksum file for everything
        run: |
          set -euo pipefail
          sha256sum gabriel-*.tar.gz gabriel-*.zip gabriel-sbom.cdx.json > checksums.txt
          cat checksums.txt

      - uses: sigstore/cosign-installer@v3

      - name: Sign the artifacts
        run: |
          set -euo pipefail
          for file in gabriel-*.tar.gz gabriel-*.zip gabriel-sbom.cdx.json checksums.txt; do
            [ -e "$file" ] || continue
            cosign sign-blob --yes \
              --output-signature "$file.sig" \
              --output-certificate "$file.pem" \
              "$file"
          done
          ls -la *.sig *.pem

      # Release notes come from CHANGELOG.md rather than a commit list: the
      # commit list says what was touched, the changelog says what changed for
      # someone using it. A missing section fails the release rather than
      # publishing an empty one.
      - name: Compose the release notes
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          fi
          ./scripts/release-notes.sh "$version" > NOTES.md
          printf '\n' >> NOTES.md
          cat docs/release-notes-footer.md >> NOTES.md
          echo "--- release notes ---"
          cat NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            gabriel-*.tar.gz
            gabriel-*.zip
            gabriel-*.sha256
            gabriel-sbom.cdx.json
            checksums.txt
            *.sig
            *.pem
            install.sh
          body_path: NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}

  # ── publishing to the public releases repository ────────────────────────────
  #
  # The source repository is private; the binaries are not. This job copies the
  # finished, signed artifacts into a separate public repository that contains
  # only releases — no source, no history, nothing but what a user downloads.
  #
  # It runs after `release`, so nothing reaches the public repository that has
  # not already passed the smoke gate and been signed. Without the token it
  # skips loudly rather than failing the workflow: a missing secret should not
  # invalidate a release that already built correctly.
  publish-public:
    name: publish to gabriel-releases
    needs: [release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Check the token is configured
        id: gate
        env:
          TOKEN: ${{ secrets.GABRIEL_RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::warning::GABRIEL_RELEASES_TOKEN is not set — binaries stay in the private repository only."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild checksums and notes for the public release
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sha256sum gabriel-*.tar.gz gabriel-*.zip gabriel-sbom.cdx.json > checksums.txt
          ./scripts/release-notes.sh "$version" > NOTES.md
          printf '\n' >> NOTES.md
          cat docs/release-notes-footer.md >> NOTES.md

      # Signatures are re-fetched, not re-made: the artifacts published here are
      # byte-identical to the ones signed in the previous job, so their existing
      # signatures must keep verifying.
      - name: Refuse to publish anything unsigned
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          missing=0
          for file in gabriel-*.tar.gz gabriel-*.zip gabriel-sbom.cdx.json; do
            [ -e "$file" ] || continue
            if [ ! -e "$file.sig" ] || [ ! -e "$file.pem" ]; then
              echo "unsigned artifact: $file"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || { echo "refusing to publish unsigned artifacts"; exit 1; }

      - name: Create the public release
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GABRIEL_RELEASES_TOKEN }}
          REPO: ${{ vars.GABRIEL_RELEASES_REPO || 'Alban-M/gabriel-releases' }}
        run: |
          set -euo pipefail
          args=""
          case "$GITHUB_REF_NAME" in
            *-*) args="--prerelease" ;;
          esac
          # --clobber so re-running a failed publish is safe.
          gh release create "$GITHUB_REF_NAME" \
            --repo "$REPO" \
            --title "Gabriel $GITHUB_REF_NAME" \
            --notes-file NOTES.md \
            $args \
            || gh release edit "$GITHUB_REF_NAME" --repo "$REPO" --notes-file NOTES.md

          gh release upload "$GITHUB_REF_NAME" \
            --repo "$REPO" --clobber \
            gabriel-*.tar.gz gabriel-*.zip gabriel-*.sha256 \
            gabriel-sbom.cdx.json checksums.txt *.sig *.pem install.sh

      # The advertised install command fetches install.sh from the releases
      # repository's default branch, not from a release asset — a release asset
      # URL would need the version the user is trying to discover. So the file
      # on that branch has to track this one.
      - name: Sync install.sh and the landing page
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GABRIEL_RELEASES_TOKEN }}
          REPO: ${{ vars.GABRIEL_RELEASES_REPO || 'Alban-M/gabriel-releases' }}
        run: |
          set -euo pipefail
          sync_file() {
            local_path="$1"
            remote_path="$2"
            existing=$(gh api "repos/$REPO/contents/$remote_path" --jq .sha 2>/dev/null || true)
            args=""
            if [ -n "$existing" ]; then
              # Unchanged content makes the API 409; skip rather than fail.
              remote_body=$(gh api "repos/$REPO/contents/$remote_path" --jq .content 2>/dev/null | tr -d '\n' || true)
              if [ "$remote_body" = "$(base64 -w0 < "$local_path")" ]; then
                echo "unchanged: $remote_path"
                return 0
              fi
              args="-f sha=$existing"
            fi
            gh api --method PUT "repos/$REPO/contents/$remote_path" \
              -f message="Update $remote_path for $GITHUB_REF_NAME" \
              -f content="$(base64 -w0 < "$local_path")" \
              $args > /dev/null
            echo "updated: $remote_path"
          }
          sync_file install.sh install.sh
          sync_file docs/releases-repo-README.md README.md

      # The last thing that runs is the first thing a user does. Everything
      # before this proves the artifact is correct; this proves it is reachable
      # and installable by someone with no access to any of it — anonymously,
      # through the advertised command, from the public repository.
      - name: Install it the way a stranger would
        if: steps.gate.outputs.ready == 'true'
        env:
          REPO: ${{ vars.GABRIEL_RELEASES_REPO || 'Alban-M/gabriel-releases' }}
        run: |
          set -euo pipefail
          # A fresh HOME so nothing from this runner's state can help.
          export HOME="$RUNNER_TEMP/stranger"
          mkdir -p "$HOME"
          cd "$HOME"

          # No token: an anonymous fetch, exactly as documented.
          curl -fsSL "https://raw.githubusercontent.com/$REPO/main/install.sh" -o install.sh
          sh install.sh
          export PATH="$HOME/.local/bin:$PATH"

          reported=$(gabriel --version)
          echo "$reported"
          echo "$reported" | grep -Fq "${GITHUB_REF_NAME#v}" \
            || { echo "installed $reported but released $GITHUB_REF_NAME"; exit 1; }

          gabriel doctor
          gabriel init stranger-check
          gabriel ls | grep -q example
          echo "a stranger can install and run this release"
