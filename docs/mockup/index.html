<meta charset="utf-8">
<title>Gabriel — design mockups</title>

<!--
  A redirect rather than a copy of workbench.html. Serving the same page from
  two paths means two files to keep in step, and the one nobody edits is the one
  that goes stale — which is exactly what gets served to whoever lands on the
  root URL.

  `location.replace` rather than a meta refresh: a refresh leaves this page in
  the history, so pressing Back from the mockup lands here and is immediately
  bounced forward again, trapping the user. `location.replace()` is specified to
  replace the current history entry rather than create a new one — that is part
  of the API contract, not an implementation detail to hope for.

  When there is more than one mockup this becomes a real index instead.
-->

<link rel="canonical" href="workbench.html">
<style>
  body {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    background: #F2F5F6; color: #101a1e;
    display: grid; place-items: center; height: 100vh; margin: 0;
  }
  a { color: #0F6E7A; }
  @media (prefers-color-scheme: dark) {
    body { background: #0C1416; color: #E2ECEE; }
    a { color: #4FAAB6; }
  }
</style>

<script>
  location.replace("workbench.html");
</script>
