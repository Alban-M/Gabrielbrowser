[package]
name = "gabriel-core"
version = "0.1.0"
edition = "2024"
description = "Request format, templating, captures and response diffing for Gabriel"
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["http", "api", "proxy", "cli", "testing"]
categories = ["command-line-utilities", "development-tools", "web-programming"]

[dependencies]
base64 = "0.23.0"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
toml = "1.1.4"
uuid = { version = "1.24.0", features = ["v4"] }
