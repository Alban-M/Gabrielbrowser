[package]
name = "gabriel-proxy"
version.workspace = true
edition = "2024"
description = "MITM capture proxy with a per-install CA for Gabriel"
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["http", "api", "proxy", "cli", "testing"]
categories = ["command-line-utilities", "development-tools", "web-programming"]

[dependencies]
futures-util = { version = "0.3.33", default-features = false }
gabriel-core.workspace = true
gabriel-engine.workspace = true
http-body-util = "0.1.4"
hyper = { version = "1.11.0", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio", "server", "client-legacy", "http1"] }
rcgen = "0.14.8"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "http2", "gzip", "brotli", "charset", "stream"] }
rustls = "0.23.43"
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync"] }
tokio-rustls = "0.26.4"
url = "2.5.8"
webpki-roots = "1.0.9"

[dev-dependencies]
gabriel-testkit.workspace = true
