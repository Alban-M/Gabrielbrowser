[package]
name = "gabriel-cli"
version.workspace = true
edition = "2024"
description = "A local-first API workbench: capture live traffic, promote it to editable requests, replay it with the session intact"
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["http", "api", "proxy", "cli", "testing"]
categories = ["command-line-utilities", "development-tools", "web-programming"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
gabriel-collection.workspace = true
gabriel-core.workspace = true
gabriel-engine.workspace = true
gabriel-proxy.workspace = true
gabriel-vault.workspace = true
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
toml = "1.1.4"

[[bin]]
name = "gabriel"
path = "src/main.rs"

[dev-dependencies]
gabriel-testkit.workspace = true
