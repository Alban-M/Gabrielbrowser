[package]
name = "gabriel-engine"
version.workspace = true
edition = "2024"
description = "HTTP, WebSocket and OAuth execution engine for Gabriel"
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["http", "api", "proxy", "cli", "testing"]
categories = ["command-line-utilities", "development-tools", "web-programming"]

[dependencies]
base64 = "0.23.0"
futures-util = { version = "0.3.33", default-features = false }
gabriel-core.workspace = true
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "http2", "json", "gzip", "brotli", "charset", "multipart", "form", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
toml = "1.1.4"

[dev-dependencies]
gabriel-testkit.workspace = true
rcgen = "0.14.8"
rustls = "0.23.43"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
tokio-rustls = "0.26.4"
