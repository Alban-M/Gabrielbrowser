[package]
name = "gabriel-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
gabriel-core = { version = "0.1.0", path = "../gabriel-core" }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "http2", "json", "gzip", "brotli", "charset", "multipart", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs"] }
toml = "1.1.4"
