[package]
name = "gabriel-vault"
version.workspace = true
edition = "2024"
description = "Encrypted secret store for Gabriel (XChaCha20-Poly1305, OS keychain or Argon2id)"
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["http", "api", "proxy", "cli", "testing"]
categories = ["command-line-utilities", "development-tools", "web-programming"]

[dependencies]
argon2 = "0.5.3"
chacha20poly1305 = "0.11.0"
gabriel-core.workspace = true
keyring = { version = "4.1.5", default-features = false, features = ["apple-native-keyring-store", "v1", "windows-native-keyring-store", "zbus-secret-service-keyring-store"] }
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"

# Referenced by no code on purpose: it enables the `keychain` feature on the
# backend that `keyring` selects for macOS, which otherwise fails to compile.
# An unused-dependency tool will suggest removing this. Do not.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.1", features = ["keychain"] }
